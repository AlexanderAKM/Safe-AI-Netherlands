name: Auto-approve webdev PRs

# Personal repos only offer Read/Write for collaborators, so the webdev
# can't get a Maintain role to bypass the required-review ruleset. This
# auto-approves her PRs instead; everyone else still needs a real review.
# Re-runs on each push since stale reviews are dismissed on push.
# Requires: Settings -> Actions -> General -> Workflow permissions ->
# "Allow GitHub Actions to create and approve pull requests".
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write

jobs:
  auto-approve:
    if: github.event.pull_request.user.login == 'SofiaKstk'
    runs-on: ubuntu-latest
    steps:
      - name: Approve PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr review "${{ github.event.pull_request.html_url }}" --approve
