name: Check text and translations

# On every pull request, and on main: the Dutch dictionary must match the
# English one's keys and placeholders (npm run i18n:check; a text not yet
# translated is only a warning on the pull request, as it shows in English), no new
# hard-coded text may reach the components (the no-literal-string lint rule
# in .eslintrc.json), and the static export must still build, which also
# fails on a message key that does not exist. It deploys nothing.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: i18n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22 like the other workflows; the npm scripts pass --use-system-ca,
      # which Node 22 supports from 22.15.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Dictionaries in step (English and Dutch)
        run: npm run i18n:check

      - name: The opportunities board's listing rules
        run: npm run test:opportunities

      - name: Lint, including no hard-coded strings
        run: npm run lint

      - name: Build the static export
        run: npm run build
